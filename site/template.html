<style>

  }

    --paper: #101714; --surface: #18211d; --ink: #e4ece7; --muted: #9aaba2; --rule: #2c3a33;
    --vaud: #4cc48b; --vaud-soft: #173326; --warn: #e6b357; --warn-soft: #2e2512;
    --eb: #b39ae0; --ed: #e79a6f; --sb: #6fb3e6; --sb268: #e58bb7; --sb269: #6fcfc7; --pj: #a9b3ae; --focus: #4cc48b; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {

  header.masthead { position: relative; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }

  .pdf-parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .pdf-parts li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 0 10px; align-items: baseline; }
  .pdf-parts a { font: 500 0.82rem var(--mono); white-space: nowrap; }
  .pdf-parts .relevant .part-content { font-weight: 600; }
  .part-pages, .part-note { color: var(--muted); font-size: 0.8rem; }

  @media (max-width: 560px) { .pdf-parts li { grid-template-columns: minmax(0, 1fr); } }
  .page-jump { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 8px; }

  .page-jump input[type="text"] { width: 6.5em; font: 500 0.9rem var(--mono); padding: 4px 8px; margin-left: 6px; }
  .page-jump output a { font: 500 0.85rem var(--mono); }
  details.raw summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); }
  details.raw pre { white-space: pre-wrap; font: 0.8rem/1.45 var(--mono); margin: 6px 0 0; color: var(--muted); }

  .timeline-box { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
  .timeline-box h3 { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .timeline-scroll { overflow-x: auto; max-height: 420px; overflow-y: auto; }
  .timeline-scroll svg { display: block; }
  .timeline-scroll text { font: 11px var(--mono); fill: var(--muted); }
  .timeline-scroll .bar { cursor: pointer; }
  .timeline-scroll .bar:hover rect { opacity: 0.75; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.78rem; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }

  h3.group { font: 600 1rem var(--display); margin: 6px 0 0; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) { .result.flash { transition: box-shadow 0.3s, border-color 0.3s; } }
</style>

<script>
const DATA = /*__DATA__*/null;

const KINDS = [
  { id: "naissance", label: "Naissance / baptême", match: ["naissance"] },
  { id: "mariage", label: "Mariage", match: ["mariage", "annonce"] },
  { id: "deces", label: "Décès", match: ["deces"] },
  { id: "catechumenes", label: "Catéchumènes", match: ["catechumenes"] },
  { id: "autre", label: "Reconnaissance / légitimation", match: ["reconnaissance", "legitimation"] },
  { id: "tous", label: "Tous", match: null },
];
const KIND_NAMES = { naissance: "naissance / baptême", mariage: "mariage", annonce: "annonce de mariage", deces: "décès", catechumenes: "catéchumènes", reconnaissance: "reconnaissance", legitimation: "légitimation", inconnu: "contenu non détaillé", pj: "pièces justificatives" };
const FONDS_ERA = {
  "Eb": "Registres paroissiaux", "Ed": "État civil cantonal", "SB 267": "État civil fédéral",
  "SB 269": "Bourgeois, hors arrondissement", "SB 268": "Promesses de mariage",
  "Ec": "Pièces justificatives", "SB 23": "Pièces justificatives", "SB 115": "Pièces justificatives", "SB 324": "Pièces justificatives",
};
const FONDS_ORDER = { "Eb": 0, "Ed": 1, "SB 267": 2, "SB 269": 3, "SB 268": 4, "Ec": 5, "SB 23": 6, "SB 115": 7, "SB 324": 8 };
const FONDS_CLASS = { "Eb": "Eb", "Ed": "Ed", "SB 267": "SB", "SB 268": "SB268", "SB 269": "SB269" };
const DIGITIZED_FONDS = new Set(["Eb", "Ed", "SB 267"]);
const NEAR_YEARS = 2;

const state = { placeIds: [], placeSince: new Map(), placeLabel: "", kind: "naissance", query: null };

const placesById = new Map(DATA.places.map(place => [place.id, place]));
const unitsBySlug = new Map(DATA.units.map(unit => [unit.slug, unit]));
const segmentsByPlace = new Map();
DATA.segments.forEach((segment, index) => {
  segment.id = `s${index}`;
  const place = unitsBySlug.get(segment.unit).place;
  if (!segmentsByPlace.has(place)) segmentsByPlace.set(place, []);
  segmentsByPlace.get(place).push(segment);
});

const normalize = text => text.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, " ").trim();
const escapeHtml = text => String(text ?? "").replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
const fondsClass = fonds => FONDS_CLASS[fonds] ?? "PJ";
const fondsColor = fonds => `var(--${{ Eb: "eb", Ed: "ed", SB: "sb", SB268: "sb268", SB269: "sb269", PJ: "pj" }[fondsClass(fonds)]})`;

function buildSuggestionIndex() {
  const entries = new Map();
  const add = (name, placeId, via, since = null) => {
    const key = normalize(name);
    if (!entries.has(key)) entries.set(key, { name, key, targets: new Map(), since: new Map() });
    const entry = entries.get(key);
    if (!entry.targets.has(placeId) || !via) entry.targets.set(placeId, via);
    entry.since.set(placeId, entry.since.has(placeId) && (!entry.since.get(placeId) || !since) ? null : since);
  };
  for (const place of DATA.places) {
    add(place.name, place.id, "");
    place.aliases.forEach(alias => add(alias, place.id, ""));
    place.localities.forEach(locality => add(locality.name, place.id, locality.qualifier || "localité rattachée", locality.since));
  }
  return [...entries.values()];
}
const SUGGESTIONS = buildSuggestionIndex();

function placeKindLabel(place) {
  return place.kind === "paroisse" ? `paroisse (${place.series.map(s => s.cote.split("/")[0]).join(", ")})` : `arrondissement d'état civil (${place.series[0].cote})`;
}

function describeTargets(entry) {
  return [...entry.targets.entries()].map(([placeId, via]) => {
    const place = placesById.get(placeId);
    return via ? `${place.name}, ${place.kind} (${via})` : `${place.kind} ${place.kind === "paroisse" ? place.series.map(s => s.cote.split("/")[0]).join(" · ") : place.series[0].cote}`;
  }).join(" — ");
}

function searchSuggestions(text) {
  const query = normalize(text);
  if (!query) return [];
  return SUGGESTIONS
    .map(entry => ({ entry, rank: entry.key === query ? 0 : entry.key.startsWith(query) ? 1 : entry.key.split(/[ -]/).some(word => word.startsWith(query)) ? 2 : entry.key.includes(query) ? 3 : 9 }))
    .filter(item => item.rank < 9)
    .sort((a, b) => a.rank - b.rank || a.entry.name.localeCompare(b.entry.name, "fr"))
    .slice(0, 12)
    .map(item => item.entry);
}

const pad = n => String(n).padStart(2, "0");
const lastDayOf = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const frenchDate = (y, m, d, parts) => new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("fr-CH", { ...parts, timeZone: "UTC" });

function yearQuery(y) {
  return { start: `${y}-01-01`, end: `${y}-12-31`, label: `en ${y}`, year: y };
}

function monthQuery(y, m) {
  if (m < 1 || m > 12) return { error: "Ce mois n'existe pas." };
  return { start: `${y}-${pad(m)}-01`, end: `${y}-${pad(m)}-${pad(lastDayOf(y, m))}`, label: `en ${frenchDate(y, m, 1, { month: "long", year: "numeric" })}`, year: y };
}

function dayQuery(y, m, d) {
  if (m < 1 || m > 12 || d < 1 || d > lastDayOf(y, m)) return { error: "Cette date n'existe pas." };
  const day = `${y}-${pad(m)}-${pad(d)}`;
  return { start: day, end: day, label: `le ${frenchDate(y, m, d, { day: "numeric", month: "long", year: "numeric" })}`, year: y };
}

function parseQueryDate(text) {
  const value = text.trim();
  if (!value) return null;
  let match;
  if ((match = value.match(/^(\d{4})$/))) return yearQuery(+match[1]);
  if ((match = value.match(/^(\d{1,2})[./](\d{4})$/))) return monthQuery(+match[2], +match[1]);
  if ((match = value.match(/^(\d{4})-(\d{1,2})$/))) return monthQuery(+match[1], +match[2]);
  if ((match = value.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/))) return dayQuery(+match[3], +match[2], +match[1]);
  if ((match = value.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return dayQuery(+match[1], +match[2], +match[3]);
  return { error: "Format non reconnu. Exemples : 1789, 03.1789, 12.03.1789." };
}

const yearOf = iso => +iso.slice(0, 4);
const shiftYears = (iso, years) => `${String(yearOf(iso) + years).padStart(4, "0")}${iso.slice(4)}`;
const overlaps = (segment, start, end) => segment.start && segment.end && segment.start <= end && segment.end >= start;

function kindMatches(segment, kindId) {
  const kind = KINDS.find(k => k.id === kindId);
  if (!kind.match || segment.kinds.includes("inconnu")) return true;
  if (segment.kinds.includes("pj") && segment.kinds.length === 1) return true;
  return segment.kinds.some(k => kind.match.includes(k));
}

function placesInForce(query) {
  return state.placeIds.filter(id => !query || !state.placeSince.get(id) || query.year >= state.placeSince.get(id));
}

function candidateSegments(query) {
  return placesInForce(query).flatMap(id => segmentsByPlace.get(id) ?? []).filter(segment => kindMatches(segment, state.kind));
}

function sortSegments(segments) {
  return segments.sort((a, b) => {
    const ua = unitsBySlug.get(a.unit), ub = unitsBySlug.get(b.unit);
    return (a.start ?? "").localeCompare(b.start ?? "") || FONDS_ORDER[ua.fonds] - FONDS_ORDER[ub.fonds] || ua.cote.localeCompare(ub.cote, "fr", { numeric: true });
  });
}

function formatDate(iso) {
  if (!iso) return "?";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y}`;
}

function formatRange(segment) {
  const start = formatDate(segment.start), end = formatDate(segment.end);
  if (segment.start?.endsWith("-01-01") && segment.end?.endsWith("-12-31")) {
    return segment.start.slice(0, 4) === segment.end.slice(0, 4) ? segment.start.slice(0, 4) : `${segment.start.slice(0, 4)} – ${segment.end.slice(0, 4)}`;
  }
  return `${start} – ${end}`;
}

const AID_KEYWORDS = { naissance: /bapt|naiss/i, mariage: /mariage/i, deces: /décès|deces|mortuaire/i, catechumenes: /catéchum|catechum/i, autre: /reconnaiss|légitim/i };

function tidyAids(aids) {
  const lines = aids.split("\n").map(line => line.replace(/\s*\(microfilm:[^)]*\)/, "").replace(/,\s*pages manuscrites, non datées\.?/, "").trim()).filter(Boolean);
  const keyword = AID_KEYWORDS[state.kind];
  const relevant = keyword ? lines.filter(line => keyword.test(line)) : [];
  return relevant.length ? relevant : lines;
}

function groupByUnit(segments) {
  const groups = new Map();
  for (const segment of segments) {
    if (!groups.has(segment.unit)) groups.set(segment.unit, { unit: unitsBySlug.get(segment.unit), segments: [] });
    groups.get(segment.unit).segments.push(segment);
  }
  return [...groups.values()];
}

const unitAnchor = slug => `u-${slug}`;
const isJustificative = segment => segment.kinds.includes("pj");

function renderSegmentLine(segment) {
  const badges = [
    segment.tb ? `<span class="badge" title="Partie écrite à l'envers, depuis la fin du registre : dans le PDF elle se trouve après la partie principale, pages retournées.">tête-bêche</span>` : "",
    segment.foreign ? `<span class="badge" title="Actes concernant des personnes d'autres paroisses.">forains / célébrés ailleurs</span>` : "",
  ].join("");
  return `<li class="segment">
    <span class="result-label">${escapeHtml(segment.label)}</span>
    <span class="result-dates">${escapeHtml(formatRange(segment))}</span>
    ${segment.pages ? `<span class="pages">${escapeHtml(segment.pages)}</span>` : ""}
    ${badges}
    ${segment.section ? `<span class="section">${escapeHtml(segment.section)}</span>` : ""}
  </li>`;
}

function partMatchesKind(part) {
  const kind = KINDS.find(k => k.id === state.kind);
  return Boolean(kind.match) && part.kinds.some(k => kind.match.includes(k));
}

const VIEWER_HELP = "https://github.com/nyg/acv-genealogie-index#aperçu-des-pdf";
const viewerInstalled = () => "acvApercu" in document.documentElement.dataset;
const viewerUrl = (unit, page) => `${unit.url}#${new URLSearchParams({ apercu: "", page, pdf: unit.pdf, titre: unit.cote })}`;
const pdfPageUrl = (unit, page) => viewerInstalled() ? viewerUrl(unit, page) : `${DATA.pdfBase}${unit.pdf}#page=${page}`;
const pdfLink = (unit, page, text) => `<a href="${escapeHtml(pdfPageUrl(unit, page))}" target="_blank" rel="noopener">${text}</a>`;
const ROMAN = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
const toRoman = number => ROMAN.reduce(([text, rest], [value, letters]) => [text + letters.repeat(Math.floor(rest / value)), rest % value], ["", number])[0];
function fromRoman(text) {
  const values = [...text.toUpperCase()].map(letter => ROMAN.find(([, letters]) => letters === letter)[0]);
  return values.reduce((sum, value, index) => sum + (value < (values[index + 1] ?? 0) ? -value : value), 0);
}

const pageSpan = ([first, last], roman = false) => {
  const [a, b] = roman ? [toRoman(first), toRoman(last)] : [first, last];
  return first === last ? `${a}` : `${a}–${b}`;
};

const within = (value, a, b) => value >= Math.min(a, b) && value <= Math.max(a, b);

function locatePage(part, page) {
  const points = [[part.pages[0], part.pdf[0]], ...part.anchors, [part.pages[1], part.pdf[1]]];
  const exact = points.find(([known]) => known === page);
  if (exact || !(part.anchors.length || part.spread)) return { pdf: exact ? exact[1] : part.pdf[0] + Math.abs(page - part.pages[0]), approx: false };
  const next = points.findIndex(([known], index) => index > 0 && within(page, points[index - 1][0], known));
  const [[fromPage, fromPdf], [toPage, toPdf]] = [points[next - 1], points[next]];
  return { pdf: Math.round(fromPdf + (page - fromPage) * (toPdf - fromPdf) / (toPage - fromPage)), approx: true };
}

function pdfTargets(unit, text) {
  const value = text.trim();
  const roman = /^[ivxlcdm]+$/i.test(value);
  if (!roman && !/^\d+$/.test(value)) return null;
  const page = roman ? fromRoman(value) : +value;
  return (unit.pdfParts ?? [])
    .filter(part => part.pages && within(page, ...part.pages) && (!roman || part.roman))
    .map(part => ({ part, ...locatePage(part, page) }));
}

function renderPageTargets(unit, text) {
  if (!text.trim()) return "";
  const targets = pdfTargets(unit, text);
  if (!targets) return "Entrez un numéro de page.";
  if (!targets.length) return `Pas dans les pages connues (${unit.pdfParts.filter(part => part.pages).map(part => pageSpan(part.pages, part.roman)).join(", ")}).`;
  return targets
    .sort((a, b) => partMatchesKind(b.part) - partMatchesKind(a.part))
    .map(({ part, pdf, approx }) => `${pdfLink(unit, pdf, `${approx ? "≈ " : ""}PDF p. ${pdf}`)} ${escapeHtml(part.content)}`)
    .join(" · ");
}

function renderPdfParts(unit) {
  const parts = unit.pdfParts.map(part => `<li class="${partMatchesKind(part) ? "relevant" : ""}">
      ${pdfLink(unit, part.pdf[0], `PDF p. ${pageSpan(part.pdf)}`)}
      <div><span class="part-content">${escapeHtml(part.content)}</span>${part.pages ? ` <span class="part-pages">registre p. ${pageSpan(part.pages, part.roman)}${part.spread ? ", deux pages par image" : ""}${part.anchors.length ? ", position approchée entre les repères" : ""}</span>` : ""}${part.note ? `<span class="part-note">${escapeHtml(part.note)}</span>` : ""}</div>
    </li>`).join("");
  const jump = unit.pdfParts.some(part => part.pages)
    ? `<div class="page-jump"><label>Page du registre<input type="text" inputmode="${unit.pdfParts.some(part => part.roman) ? "text" : "numeric"}" autocomplete="off" data-page-unit="${escapeHtml(unit.slug)}"></label><output aria-live="polite"></output></div>`
    : "";
  return `<ul class="pdf-parts">${parts}</ul>${jump}`;
}

function renderResult({ unit, segments }) {
  const rows = [
    unit.aids ? ["Répertoire", tidyAids(unit.aids).map(escapeHtml).join("<br>")] : null,
    unit.pdfParts ? ["Dans le PDF", renderPdfParts(unit)] : null,
    unit.extent ? ["Volume", escapeHtml(unit.extent.split("\n")[0])] : null,
    unit.note ? ["Remarque", escapeHtml(unit.note).replace(/\n/g, "<br>")] : null,
  ].filter(Boolean);
  const pdf = unit.pdf
    ? `<a href="${DATA.pdfBase}${escapeHtml(unit.pdf)}" target="_blank" rel="noopener">Ouvrir le PDF${unit.pdfSize ? ` (${escapeHtml(unit.pdfSize.replace("MiB", "Mo"))})` : ""}</a>`
    : `<span class="no-pdf">${DIGITIZED_FONDS.has(unit.fonds) ? "Pas de PDF en ligne (délai de protection ou pas encore numérisé) : consultable aux ACV." : "Non numérisé : à consulter en salle de lecture ou à demander aux ACV."}</span>`;
  const browse = unit.pdf && viewerInstalled() ? pdfLink(unit, unit.pdfParts?.[0].pdf[0] ?? 1, "Feuilleter le PDF") : "";
  return `<li class="result" id="${unitAnchor(unit.slug)}">
    <div class="result-head">
      <span class="chip ${fondsClass(unit.fonds)}">${escapeHtml(unit.fonds)}</span>
      <span class="cote">${escapeHtml(unit.cote)}</span>
      <span class="unit-dates">${escapeHtml(unit.dates)}</span>
    </div>
    <ul class="segments">${segments.map(renderSegmentLine).join("")}</ul>
    ${rows.length ? `<dl class="meta">${rows.map(([dt, dd]) => `<dt>${dt}</dt><dd>${dd}</dd>`).join("")}</dl>` : ""}
    <div class="links">${browse}${pdf}<a href="${escapeHtml(unit.url)}" target="_blank" rel="noopener">Fiche descriptive</a></div>
    ${unit.scope ? `<details class="raw"><summary>Description d'origine</summary><pre>${escapeHtml(unit.scope)}</pre></details>` : ""}
  </li>`;
}

function renderResults(segments) {
  return `<ul class="results">${groupByUnit(segments).map(renderResult).join("")}</ul>`;
}

function renderTimeline(segments, query) {
  const dated = segments.filter(s => s.start && s.end);
  const rows = groupByUnit(dated);
  if (rows.length < 2) return "";
  const minYear = Math.min(...dated.map(s => yearOf(s.start)), query ? query.year : Infinity);
  const maxYear = Math.max(...dated.map(s => yearOf(s.end)), query ? query.year : -Infinity);
  const from = Math.floor(minYear / 10) * 10, to = Math.ceil((maxYear + 1) / 10) * 10;
  const available = document.getElementById("answers").clientWidth - 30;
  const labelWidth = 118, width = Math.max(480, available), rowHeight = 18, top = 22;
  const height = top + rows.length * rowHeight + 8;
  const x = iso => labelWidth + ((yearOf(iso) - from) + (new Date(`${iso}T00:00:00Z`).getUTCMonth() / 12)) / (to - from) * (width - labelWidth - 10);
  const step = to - from > 200 ? 50 : to - from > 80 ? 20 : 10;
  const ticks = [];
  for (let year = from; year <= to; year += step) ticks.push(year);
  const colorOf = fondsColor;
  const bars = rows.map(({ unit, segments: unitSegments }, index) => {
    const y = top + index * rowHeight;
    const description = unitSegments.map(s => `${s.label} ${formatRange(s)}`).join(" ; ");
    const rects = unitSegments.map(segment => {
      const x1 = x(segment.start), x2 = Math.max(x(segment.end), x1 + 3);
      return `<rect x="${x1}" y="${y + 3}" width="${x2 - x1}" height="${rowHeight - 6}" rx="2" fill="${colorOf(unit.fonds)}" opacity="${segment.kinds.includes("inconnu") ? 0.45 : 0.85}"></rect>`;
    }).join("");
    return `<g class="bar" data-target="${unitAnchor(unit.slug)}" tabindex="0" role="button" aria-label="${escapeHtml(unit.cote)} : ${escapeHtml(description)}">
      <title>${escapeHtml(unit.cote)} · ${escapeHtml(description)}</title>
      <text x="${labelWidth - 8}" y="${y + 12}" text-anchor="end">${escapeHtml(unit.cote)}</text>
      ${rects}
    </g>`;
  }).join("");
  const grid = ticks.map(year => {
    const xx = x(`${year}-01-01`);
    return `<line x1="${xx}" x2="${xx}" y1="${top - 4}" y2="${height}" stroke="var(--rule)" stroke-width="1"></line><text x="${xx}" y="12" text-anchor="middle">${year}</text>`;
  }).join("");
  const marker = query ? (() => {
    const x1 = x(query.start), x2 = Math.max(x(query.end), x1 + 2);
    return `<rect x="${x1}" y="${top - 6}" width="${x2 - x1}" height="${height - top + 6}" fill="var(--vaud)" opacity="0.18"></rect><line x1="${x1}" x2="${x1}" y1="${top - 6}" y2="${height}" stroke="var(--vaud)" stroke-width="2"></line>`;
  })() : "";
  const fondsPresent = [...new Set(dated.map(s => unitsBySlug.get(s.unit).fonds))];
  return `<section class="timeline-box" aria-label="Couverture chronologique">
    <h3>Couverture chronologique</h3>
    <div class="legend">${fondsPresent.map(f => `<span style="--c:${colorOf(f)}">${escapeHtml(f)} · ${FONDS_ERA[f]}</span>`).join("")}${query ? `<span style="--c:var(--vaud)">date recherchée</span>` : ""}</div>
    <div class="timeline-scroll"><svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">${grid}${marker}${bars}</svg></div>
  </section>`;
}

function contextNotices(query) {
  const notes = [];
  const places = state.placeIds.map(id => placesById.get(id));
  const pending = places.flatMap(place => place.series.filter(series => !series.scraped).map(series => ({ place, series })));
  if (pending.length) {
    notes.push(`Pas encore indexé : ${pending.map(({ series }) => `<a href="${escapeHtml(series.url)}" target="_blank" rel="noopener">${escapeHtml(series.cote)}</a> (${escapeHtml(series.dates)})`).join(", ")}. Ces registres existent mais leur contenu n'est pas encore dans l'index.`);
  }
  if (query) {
    if (query.start <= "1821-06-30" && query.end >= "1821-01-01") notes.push("En 1821, les registres paroissiaux (Eb) s'arrêtent au 30 juin et l'état civil cantonal (Ed) commence le 1er juillet.");
    if (query.year >= 1876 && !places.some(place => place.kind === "arrondissement")) notes.push("Dès 1876, les actes sont dans les registres de l'arrondissement d'état civil (SB 267). Cherchez le nom de l'arrondissement dont dépendait la commune.");
    if (query.year < 1876 && !places.some(place => place.kind === "paroisse")) notes.push("Avant 1876, les actes sont dans les registres de la paroisse (Eb, Ed). Cherchez le nom de la paroisse.");
    const now = new Date().getUTCFullYear();
    const limits = { naissance: 110, mariage: 80, deces: 50 };
    if (limits[state.kind] && query.year > now - limits[state.kind]) notes.push(`Les actes de ${KIND_NAMES[state.kind]} de moins de ${limits[state.kind]} ans ne sont pas librement consultables (délai de protection).`);
  }
  return notes.length ? `<div class="notice">${notes.map(note => `<p>${note}</p>`).join("")}</div>` : "";
}

function render() {
  const answers = document.getElementById("answers");
  if (!state.placeIds.length) {
    answers.innerHTML = `<p class="summary">Choisissez un lieu pour savoir dans quel registre chercher un acte.</p>
      <div class="notice"><p>Commencez à taper le nom d'une paroisse, d'un arrondissement d'état civil ou d'un hameau mentionné dans les inventaires, par exemple <a href="#" data-example="Aigle">Aigle</a>, <a href="#" data-example="Huémoz">Huémoz</a> ou <a href="#" data-example="Corbeyrier">Corbeyrier</a>.</p></div>`;
    return;
  }
  const query = state.query && !state.query.error ? state.query : null;
  const segments = candidateSegments(query);
  const kindLabel = KINDS.find(k => k.id === state.kind).label.toLowerCase();
  const justificativeGroup = list => list.length
    ? `<h3 class="group">Pièces justificatives</h3><p class="group-note">Dossiers non numérisés qui accompagnent les actes (publications, certificats, consentements). À consulter ou commander aux ACV avec la cote.</p>${renderResults(list)}`
    : "";
  let body;
  if (query) {
    const exact = sortSegments(segments.filter(s => overlaps(s, query.start, query.end)));
    const registers = exact.filter(s => !isJustificative(s));
    const justificatives = exact.filter(isJustificative);
    const exactUnits = new Set(exact.map(s => s.unit));
    const near = sortSegments(segments.filter(s => !isJustificative(s) && !exactUnits.has(s.unit) && overlaps(s, shiftYears(query.start, -NEAR_YEARS), shiftYears(query.end, NEAR_YEARS))));
    const count = new Set(registers.map(s => s.unit)).size;
    const headline = count
      ? `${count === 1 ? "Un registre couvre" : `${count} registres couvrent`} <em>${escapeHtml(kindLabel)}</em> ${escapeHtml(query.label)} pour <em>${escapeHtml(state.placeLabel)}</em>.`
      : `Aucun registre indexé ne couvre <em>${escapeHtml(kindLabel)}</em> ${escapeHtml(query.label)} pour <em>${escapeHtml(state.placeLabel)}</em>.`;
    body = `<p class="summary">${headline}</p>${contextNotices(query)}
      ${count ? renderResults(registers) : ""}
      ${justificativeGroup(justificatives)}
      ${near.length ? `<h3 class="group">Registres voisins (± ${NEAR_YEARS} ans)</h3>${renderResults(near)}` : ""}
      ${renderTimeline(sortSegments(segments.filter(s => !isJustificative(s))), query)}`;
  } else {
    const all = sortSegments([...segments]);
    const registers = all.filter(s => !isJustificative(s));
    const count = new Set(registers.map(s => s.unit)).size;
    body = `<p class="summary">${count} registres pour <em>${escapeHtml(kindLabel)}</em> à <em>${escapeHtml(state.placeLabel)}</em>. Ajoutez une date pour cibler.</p>${contextNotices(null)}
      ${renderTimeline(registers, null)}
      ${renderResults(registers)}
      ${justificativeGroup(all.filter(isJustificative))}`;
  }
  answers.innerHTML = body;
}

function renderPlaceCard() {
  const card = document.getElementById("place-card");
  if (!state.placeIds.length) { card.hidden = true; return; }
  card.hidden = false;
  card.innerHTML = state.placeIds.map(id => {
    const place = placesById.get(id);
    const localities = place.localities.length
      ? `<div class="localities">${place.localities.length} localités rattachées (survolez un nom pour le détail) : ${place.localities.map(l => `<strong title="${escapeHtml(l.qualifier)}">${escapeHtml(l.name)}</strong>`).join(", ")}</div>` : "";
    const note = place.series.find(s => s.note)?.note;
    const more = localities || note
      ? `<details class="note" ${matchMedia("(min-width: 821px)").matches ? "open" : ""}><summary>Localités et note de l'inventaire</summary>${localities}${note ? `<p>${escapeHtml(note)}</p>` : ""}</details>`
      : "";
    return `<div>
      <h2>${escapeHtml(place.name)}</h2>
      <div class="localities">${escapeHtml(place.kind === "paroisse" ? "Paroisse" : "Arrondissement d'état civil")}${place.aliases.length ? ` · aussi « ${place.aliases.map(escapeHtml).join(" », « ")} »` : ""}</div>
      <ul class="series-list">${place.series.map(s => `<li><span class="chip ${fondsClass(s.fonds)}">${escapeHtml(s.fonds)}</span><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.cote)}</a><span>${escapeHtml(s.dates)}</span>${s.scraped ? "" : `<span class="pending">non indexé</span>`}</li>`).join("")}</ul>
      ${more}
    </div>`;
  }).join("");
}

function selectEntry(entry) {
  state.placeIds = [...entry.targets.keys()].sort((a, b) => (placesById.get(a).kind === "paroisse" ? 0 : 1) - (placesById.get(b).kind === "paroisse" ? 0 : 1));
  state.placeLabel = entry.name;
  state.placeSince = entry.since;
  document.getElementById("place-input").value = entry.name;
  const via = [...entry.targets.entries()].filter(([, v]) => v).map(([id, v]) => `${placesById.get(id).name} (${v})`);
  document.getElementById("place-hint").textContent = via.length ? `Rattaché à : ${via.join(" ; ")}` : "";
  closeSuggestions();
  renderPlaceCard();
  render();
  remember();
}

const input = document.getElementById("place-input");
const list = document.getElementById("place-suggestions");
let current = [];
let active = -1;

function closeSuggestions() { list.hidden = true; input.setAttribute("aria-expanded", "false"); active = -1; }
function showSuggestions() {
  current = searchSuggestions(input.value);
  if (!current.length) { closeSuggestions(); return; }
  list.innerHTML = current.map((entry, index) => `<li role="option" id="opt-${index}" data-index="${index}" aria-selected="${index === active}"><span class="s-name">${escapeHtml(entry.name)}</span><span class="s-meta">${escapeHtml(describeTargets(entry))}</span></li>`).join("");
  list.hidden = false;
  input.setAttribute("aria-expanded", "true");
}
input.addEventListener("input", () => { active = -1; showSuggestions(); });
input.addEventListener("focus", () => { if (input.value) showSuggestions(); });
input.addEventListener("keydown", event => {
  if (list.hidden && event.key === "ArrowDown") { showSuggestions(); return; }
  if (event.key === "ArrowDown" || event.key === "ArrowUp") {
    event.preventDefault();
    active = (active + (event.key === "ArrowDown" ? 1 : -1) + current.length) % current.length;
    showSuggestions();
    input.setAttribute("aria-activedescendant", `opt-${active}`);
  } else if (event.key === "Enter") {
    event.preventDefault();
    const entry = current[active >= 0 ? active : 0];
    if (entry) selectEntry(entry);
  } else if (event.key === "Escape") closeSuggestions();
});
list.addEventListener("mousedown", event => {
  const item = event.target.closest("li[data-index]");
  if (item) { event.preventDefault(); selectEntry(current[+item.dataset.index]); }
});
input.addEventListener("blur", () => setTimeout(closeSuggestions, 100));

const kindsBox = document.getElementById("kinds");
kindsBox.innerHTML = KINDS.map(kind => `<button type="button" data-kind="${kind.id}" aria-pressed="${kind.id === state.kind}">${kind.label}</button>`).join("");
kindsBox.addEventListener("click", event => {
  const button = event.target.closest("button[data-kind]");
  if (!button) return;
  state.kind = button.dataset.kind;
  kindsBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === button)));
  render();
  remember();
});

const dateInput = document.getElementById("date-input");
const dateHint = document.getElementById("date-hint");
dateInput.addEventListener("input", () => {
  state.query = parseQueryDate(dateInput.value);
  dateHint.classList.toggle("bad", Boolean(state.query?.error));
  dateHint.textContent = !state.query ? "Laissez vide pour voir tous les registres." : state.query.error ?? `Recherche ${state.query.label}.`;
  render();
  remember();
});

document.getElementById("answers").addEventListener("click", event => {
  const example = event.target.closest("[data-example]");
  if (example) {
    event.preventDefault();
    const entry = SUGGESTIONS.find(s => s.key === normalize(example.dataset.example));
    if (entry) selectEntry(entry);
    return;
  }
  const bar = event.target.closest(".bar");
  if (bar) jumpTo(bar.dataset.target);
});
document.getElementById("answers").addEventListener("input", event => {
  const field = event.target.closest("[data-page-unit]");
  if (field) field.closest(".page-jump").querySelector("output").innerHTML = renderPageTargets(unitsBySlug.get(field.dataset.pageUnit), field.value);
});
document.getElementById("answers").addEventListener("keydown", event => {
  const bar = event.target.closest(".bar");
  if (bar && (event.key === "Enter" || event.key === " ")) { event.preventDefault(); jumpTo(bar.dataset.target); }
});
function jumpTo(id) {
  const target = document.getElementById(id);
  if (!target) return;
  target.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  target.classList.add("flash");
  setTimeout(() => target.classList.remove("flash"), 1400);
}

function remember() {
  try { localStorage.setItem("registres-vaudois", JSON.stringify({ place: state.placeLabel, kind: state.kind, date: dateInput.value })); } catch {}
}
function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("registres-vaudois") || "null"); } catch {}
  saved ??= { place: "Aigle", kind: "naissance", date: "1752" };
  if (saved.kind && KINDS.some(k => k.id === saved.kind)) {
    state.kind = saved.kind;
    kindsBox.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === state.kind)));
  }
  if (saved.date) { dateInput.value = saved.date; dateInput.dispatchEvent(new Event("input")); }
  const entry = saved.place && SUGGESTIONS.find(s => s.key === normalize(saved.place));
  if (entry) selectEntry(entry); else render();
}

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

const allSeries = DATA.places.flatMap(place => place.series);
const listFormat = new Intl.ListFormat("fr", { type: "conjunction" });
const plural = (count, word) => `${count} ${word}${count > 1 ? "s" : ""}`;

function fondsCoverageRow(fonds) {
  const units = DATA.units.filter(unit => unit.fonds === fonds);
  const years = [...units.map(unit => unit.start), ...units.map(unit => unit.end)].filter(Boolean).map(date => date.slice(0, 4)).sort();
  const series = allSeries.filter(s => s.fonds === fonds);
  const indexedSeries = series.filter(s => s.scraped).length;
  const seriesText = DIGITIZED_FONDS.has(fonds) ? `${indexedSeries} séries sur ${series.length}` : series.length ? plural(series.length, "série") : "";
  const source = DIGITIZED_FONDS.has(fonds) ? "davel-vd.ch, avec PDF" : "davel.vd.ch, sans PDF";
  return `<tr><td><span class="chip ${fondsClass(fonds)}">${escapeHtml(fonds)}</span></td>
    <td>${escapeHtml(FONDS_ERA[fonds] ?? fonds)}<small>${years[0]}-${years.at(-1)} · ${source}</small></td>
    <td>${plural(units.length, "registre")}${seriesText ? `<small>${seriesText}</small>` : ""}</td></tr>`;
}

function placeButtons(places) {
  return places.sort((a, b) => a.name.localeCompare(b.name, "fr")).map(place => `<button type="button" data-place="${place.id}">${escapeHtml(place.name)}</button>`).join(", ");
}

function renderCoverage() {
  const indexed = DATA.places.filter(place => place.series.some(s => s.scraped && DIGITIZED_FONDS.has(s.fonds)));
  const parishes = indexed.filter(place => place.kind === "paroisse");
  const arrondissements = indexed.filter(place => place.kind === "arrondissement");
  const parishTotal = DATA.places.filter(place => place.kind === "paroisse").length;
  const arrondissementTotal = DATA.places.filter(place => place.kind === "arrondissement").length;
  const mapped = DATA.units.filter(unit => unit.pdfParts);
  const mappedNames = [...new Set(mapped.map(unit => placesById.get(unit.place).name))].sort((a, b) => a.localeCompare(b, "fr"));
  const fonds = [...new Set(DATA.units.map(unit => unit.fonds))].sort((a, b) => FONDS_ORDER[a] - FONDS_ORDER[b]);
  document.getElementById("coverage-toggle").textContent = `Indexé : ${parishes.length} paroisses sur ${parishTotal}, ${arrondissements.length} arrondissements sur ${arrondissementTotal}`;
  document.getElementById("coverage-panel").innerHTML = `<h2>Ce que l'index contient</h2>
    <p>Les registres sont détaillés (actes, dates, pages) pour ${plural(parishes.length, "paroisse")} et ${plural(arrondissements.length, "arrondissement")} d'état civil. Les ${parishTotal - parishes.length} autres paroisses et ${arrondissementTotal - arrondissements.length} autres arrondissements apparaissent avec la liste de leurs séries et un lien vers l'inventaire, sans le détail des registres (« non indexé »).</p>
    <p class="places"><strong>Paroisses</strong> : ${placeButtons(parishes)}</p>
    <p class="places"><strong>Arrondissements</strong> : ${placeButtons(arrondissements)}</p>
    <table>${fonds.map(fondsCoverageRow).join("")}</table>
    ${mapped.length ? `<p><strong>Pages du PDF</strong> : pour ${escapeHtml(listFormat.format(mappedNames))} (${plural(mapped.length, "registre")}), la page du registre citée par le répertoire donne la page du PDF à ouvrir. Ailleurs, le PDF s'ouvre à sa première page.</p>` : ""}
    <p><strong>Aperçu</strong> : ${viewerInstalled()
      ? "le script d'aperçu est installé : les liens « PDF p. » n'affichent que la page demandée, sans télécharger le PDF entier."
      : `les PDF pèsent souvent plusieurs centaines de Mo. Avec le <a href="${VIEWER_HELP}" target="_blank" rel="noopener">script d'aperçu</a> (Chrome et Tampermonkey), les liens « PDF p. » n'en chargent que la page demandée.`}</p>
    <p class="muted">Inventaires extraits le ${new Date(DATA.generatedAt).toLocaleDateString("fr-CH")}.</p>`;
}

const coverage = document.getElementById("coverage");
const coverageToggle = document.getElementById("coverage-toggle");
function setCoverageOpen(open) {
  coverage.classList.toggle("open", open);
  coverageToggle.setAttribute("aria-expanded", String(open));
}
coverageToggle.addEventListener("click", () => {
  coverage.classList.remove("closed");
  setCoverageOpen(!coverage.classList.contains("open"));
});
coverage.addEventListener("click", event => {
  const button = event.target.closest("[data-place]");
  if (!button) return;
  const entry = SUGGESTIONS.find(s => s.key === normalize(placesById.get(button.dataset.place).name));
  if (entry) selectEntry(entry);
  setCoverageOpen(false);
  coverage.classList.add("closed");
});
coverage.addEventListener("mouseleave", () => coverage.classList.remove("closed"));
addEventListener("click", event => { if (!coverage.contains(event.target)) setCoverageOpen(false); });
addEventListener("keydown", event => { if (event.key === "Escape") setCoverageOpen(false); });
renderCoverage();
document.addEventListener("acv-apercu", () => { render(); renderCoverage(); });
document.getElementById("provenance").innerHTML = `Index non officiel construit à partir des inventaires des <a href="https://www.vd.ch/etat-droit-finances/archives-acv" target="_blank" rel="noopener">Archives cantonales vaudoises</a> (davel-vd.ch, davel.vd.ch) et de leurs tables de correspondance, extraits le ${new Date(DATA.generatedAt).toLocaleDateString("fr-CH")}. Données sous licence <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.fr" target="_blank" rel="noopener">CC BY-SA 4.0</a>. Les dates et pages viennent des descriptions d'archives : vérifiez toujours sur la fiche descriptive.`;
restore();
</script>
